<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#12352d" />
  <meta name="description" content="云栖酒店运营管理系统" />
  <title>云栖酒店 · 运营台</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>

  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M8 14h2M14 14h2M8 17h2"/></symbol>
    <symbol id="i-bed" viewBox="0 0 24 24"><path d="M3 18v-7h18v7M3 11V7M21 18v2M3 18v2M7 11V8h5a3 3 0 0 1 3 3"/><path d="M15 11V8h3a3 3 0 0 1 3 3"/></symbol>
    <symbol id="i-door" viewBox="0 0 24 24"><path d="M5 21V4a1 1 0 0 1 1-1h11a1 1 0 0 1 1 1v17M3 21h18"/><circle cx="14" cy="12" r="1"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M5 3v18l3-2 2 2 2-2 2 2 2-2 3 2V3l-3 2-2-2-2 2-2-2-2 2z"/><path d="M9 9h6M9 13h6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M18.5 9a7 7 0 0 0-12-2M5.5 15a7 7 0 0 0 12 2"/></symbol>
    <symbol id="i-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 9h.01M18 15h.01"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M10.3 3.8 2.2 18a2 2 0 0 0 1.7 3h16.2a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-broom" viewBox="0 0 24 24"><path d="m14 4 6 6M16 6 8 14M6 12l6 6M3 21l3-3M9 15l-3 3"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m11 12 9-9M16 7l2 2M13 10l2 2"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M20 7V5a2 2 0 0 0-2-2H5a3 3 0 0 0 0 6h16v10a2 2 0 0 1-2 2H5a3 3 0 0 1-3-3V6"/><path d="M16 13h2"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></symbol>
  </svg>

  <div class="app-shell" id="app" aria-busy="true">
    <aside class="sidebar" id="sidebar">
      <div class="brand-block">
        <button class="brand" type="button" data-nav="dashboard" aria-label="返回工作台">
          <span class="brand-mark" aria-hidden="true">云</span>
          <span class="brand-copy">
            <strong>云栖酒店</strong>
            <small>湖滨店 · 运营台</small>
          </span>
        </button>
      </div>

      <nav class="primary-nav" aria-label="主要导航">
        <p class="nav-label">运营</p>
        <a class="nav-item" href="#/dashboard" data-route="dashboard"><span class="nav-icon"><svg><use href="#i-grid"></use></svg></span><span>工作台</span></a>
        <a class="nav-item" href="#/bookings" data-route="bookings"><span class="nav-icon"><svg><use href="#i-calendar"></use></svg></span><span>预订管理</span><span class="nav-badge" id="arrivalBadge">0</span></a>
        <a class="nav-item" href="#/rooms" data-route="rooms"><span class="nav-icon"><svg><use href="#i-bed"></use></svg></span><span>房态中心</span></a>
        <a class="nav-item" href="#/frontdesk" data-route="frontdesk"><span class="nav-icon"><svg><use href="#i-door"></use></svg></span><span>入住 / 退房</span></a>
        <p class="nav-label nav-label-spaced">档案与账务</p>
        <a class="nav-item" href="#/guests" data-route="guests"><span class="nav-icon"><svg><use href="#i-users"></use></svg></span><span>宾客档案</span></a>
        <a class="nav-item" href="#/finance" data-route="finance"><span class="nav-icon"><svg><use href="#i-receipt"></use></svg></span><span>账单与收款</span></a>
      </nav>

      <div class="sidebar-note">
        <div class="sidebar-note-icon"><svg><use href="#i-broom"></use></svg></div>
        <div>
          <strong id="sidebarTaskCount">0 项待处理</strong>
          <small>客房与工程任务</small>
        </div>
        <a href="#/rooms" aria-label="查看房态"><svg><use href="#i-arrow"></use></svg></a>
      </div>

      <div class="sidebar-user">
        <span class="avatar avatar-dark">林</span>
        <span class="user-copy"><strong>林知夏</strong><small>值班经理 · 早班</small></span>
        <button type="button" class="icon-button icon-button-dark" aria-label="打开个人菜单"><svg><use href="#i-more"></use></svg></button>
      </div>
    </aside>

    <div class="mobile-scrim" id="mobileScrim"></div>

    <div class="main-column">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu-button" id="menuButton" type="button" aria-label="打开导航" aria-expanded="false"><svg><use href="#i-menu"></use></svg></button>
          <div class="hotel-status"><span class="live-dot"></span><span>系统运行正常</span><span class="topbar-divider"></span><span id="todayLabel">今日</span></div>
        </div>
        <div class="topbar-actions">
          <label class="global-search">
            <svg><use href="#i-search"></use></svg>
            <input id="globalSearch" type="search" placeholder="搜索宾客、预订或房间" autocomplete="off" />
            <kbd>/</kbd>
          </label>
          <button class="icon-button notification-button" id="notificationButton" type="button" aria-label="查看待办通知">
            <svg><use href="#i-bell"></use></svg>
            <span class="notification-dot" id="notificationDot"></span>
          </button>
          <button class="user-chip" type="button" aria-label="打开账户菜单">
            <span class="avatar">林</span>
            <span>林知夏</span>
            <svg><use href="#i-chevron"></use></svg>
          </button>
        </div>
      </header>

      <main class="main-content" id="main-content" tabindex="-1">
        <div class="loading-state" id="loadingState">
          <div class="loading-mark">云</div>
          <p>正在整理今日运营数据…</p>
        </div>
        <div id="view"></div>
      </main>
    </div>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <div id="modalRoot"></div>
  <div id="drawerRoot"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
